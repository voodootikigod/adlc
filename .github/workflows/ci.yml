name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # full history so origin/main resolves for merge-base-dependent tests

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      # Required proof against the Codex release this integration is developed
      # against. Keep the pin deliberate so upstream drift cannot make the
      # required job non-deterministic; the advisory job below tracks latest.
      - name: Codex native plugin live install proof (pinned)
        if: matrix.node-version == 22
        run: |
          npm install -g @openai/codex@0.144.1
          codex --version
          ADLC_CODEX_LIVE_INSTALL=1 node scripts/codex-install-smoke.mjs .

      # AC7 — OpenCode live deny proof (ADR 0004 amendment 2026-07-05).
      # Folded into the REQUIRED test job (not a separate optional job) on
      # purpose: on a private free-plan repo new required checks can't be added
      # (403), and an optional live-deny job would let a refactor silently kill
      # the enforcement throw and still merge — the exact regression class the
      # adversarial design review flagged. Runs on one matrix leg to keep CI
      # time bounded; --require makes a missing opencode binary a hard failure.
      # PINNED to the version the plugin contract is verified against (ADR 0004
      # amendment) so upstream releases can't flake or mask regressions in a
      # required job; bump deliberately alongside the peerDependency. A separate
      # non-required job may track latest.
      - name: OpenCode live deny proof (AC7)
        if: matrix.node-version == 20
        run: |
          npm install -g opencode-ai@1.17.13
          node scripts/opencode-live-deny.mjs --require

      # Phase 4 live proof: the native adlc_gate tool registers + is model-callable,
      # and the keyless bridge drives a child session end-to-end. Pinned to the
      # opencode whose tool-hook + session SDK is source-verified (1.17.13).
      - name: OpenCode live tool + keyless proof (Phase 4)
        if: matrix.node-version == 20
        run: node scripts/opencode-live-tool.mjs --require

      # T32 compaction REGISTRATION + BEHAVIOR proof (NOT a host-dispatch proof):
      # asserts the session.compacting + compaction.autocontinue hooks are
      # registered on the real plugin entry under their exact host keys and behave
      # (rail context survives, auto-continue suppressed on a degraded high-risk
      # session). Loads the plugin the way opencode does (no binary needed → all
      # matrix legs). REQUIRED so a refactor dropping/renaming either hook cannot
      # merge green. Upstream DISPATCH on the pinned version is source-verified,
      # not asserted here (compaction is not forcible in a headless run).
      - name: OpenCode compaction registration+behavior proof (T32)
        run: node scripts/opencode-live-compaction.mjs

      # T33 deterministic P5 proof: the shipped adlc_prosecute tool drives the
      # fan-out → verify → loop-until-dry loop in first-party code over
      # WRITE-DISABLED child sessions, converging a seeded defect to NO-SHIP.
      # Runs against a real-shaped mock SDK client (a full multi-lens loop isn't
      # deterministically forcible through a real binary) — registration on the
      # real binary is proven by the live-tool step above. REQUIRED.
      - name: OpenCode deterministic prosecute proof (T33)
        run: node scripts/opencode-live-prosecute.mjs

      # pi live deny proof (ticket T21 AC5) — same folded-into-required-job
      # rationale as the OpenCode step above. Runs on the Node 22 leg only
      # (pi requires Node >= 22.19; the script hard-skips on older majors and
      # hard-fails if the pinned pi binary is missing on a supported Node).
      # The pi version is PINNED via the repo devDependency
      # (@earendil-works/pi-coding-agent) so upstream releases can't flake a
      # required job; bump deliberately alongside the plugin peerDependency.
      # MUST stay in this REQUIRED matrix job (the Node 22 leg) — it depends on
      # matrix.node-version and would silently never run in a non-matrix job.
      - name: pi live deny proof (T21 AC5)
        if: matrix.node-version == 22
        run: node scripts/pi-live-deny.mjs

      # pi Phase 4 live proof (ticket T26 AC5): the native adlc_prosecute tool
      # registers (via the pi-runtime TypeBox peer) and is model-callable
      # end-to-end in a real pi loop — a stub turn calls adlc_prosecute with
      # base=HEAD (empty diff → CLEAN, no child spawns) and the result reaches
      # the model. Same folded-into-required-job + Node-22-only rationale as the
      # deny proof above; a regression that unregisters the tool fails here.
      - name: pi live prosecute proof (T26 AC5)
        if: matrix.node-version == 22
        run: node scripts/pi-live-prosecute.mjs

  # T31 drift canary: the SAME two OpenCode live proofs against opencode-ai@latest.
  # ADVISORY by design (continue-on-error): upstream releases near-daily, and a
  # latest-version break must be VISIBLE same-day without blocking unrelated
  # merges — the required, pinned proofs in the test job above stay authoritative.
  # Bump the pin deliberately when this canary shows sustained green on a newer line.
  # Single Node 20, NO matrix — so no step here may use a matrix.* condition.
  opencode-live-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: OpenCode live proofs vs latest
        run: |
          npm install -g opencode-ai@latest
          opencode --version
          node scripts/opencode-live-deny.mjs --require
          node scripts/opencode-live-tool.mjs --require

  # Advisory drift canary. The pinned proof in the required test matrix remains
  # authoritative while this job exposes changes in the newest Codex release.
  codex-live-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Codex native plugin live install proof vs latest
        run: |
          npm install -g @openai/codex@latest
          codex --version
          ADLC_CODEX_LIVE_INSTALL=1 node scripts/codex-install-smoke.mjs .

  pre-ga-gate:
    # Explicit CI gate that fails with a clear message while either of the two
    # unverified Pre-GA assumptions documented in docs/adr/0003-adlc-claude-code-plugin.md
    # remain open (marked [ ] in the checklist).
    #
    # This job exists specifically to prevent "CI is green → GA-ready" confusion:
    # the test and rails-guard jobs pass on structural correctness; this job is the
    # ONLY machine-enforced block on announcing GA before the live install tests are done.
    #
    # ============================================================
    # ACTION REQUIRED — GITHUB REPOSITORY SETTINGS
    # ============================================================
    # This job MUST be added as a required status check in GitHub repository
    # Settings > Branches > Branch protection rules for the main branch.
    #
    #   Steps:
    #     1. Go to: Settings → Branches → Branch protection rules → main (or add new rule)
    #     2. Enable "Require status checks to pass before merging"
    #     3. Search for and add "pre-ga-gate" to the required status checks list
    #     4. Save the rule
    #
    # WITHOUT this step, this job can fail and still NOT block a merge.
    # The gate is only effective as a hard enforcement wall when it is a
    # required check. A failing-but-not-required pre-ga-gate is theatre.
    # See docs/adr/0003-adlc-claude-code-plugin.md § "Pre-GA checklist" for details.
    # ============================================================
    #
    # To resolve and remove this gate: complete both live install tests (Pre-GA
    # checklist items 1, 3, and 4 in the ADR), update the ADR checkboxes from [ ] to [x],
    # then remove or disable this job.
    #
    # NOTE: There is currently no automated check that "pre-ga-gate" and "rails-guard"
    # have been added as required status checks in GitHub repository settings. A failing
    # but non-required pre-ga-gate is theatre — it will not block a merge. To verify that
    # branch protection is configured correctly, query the GitHub API:
    #   gh api repos/{owner}/{repo}/branches/main/protection
    # and confirm both jobs appear in required_status_checks.contexts. This step must be
    # completed manually before merging any branch that depends on these gates.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Pre-GA live install tests not yet confirmed
        shell: bash
        run: |
          ADR="docs/adr/0003-adlc-claude-code-plugin.md"
          # Count lines that contain an open Pre-GA checklist item:
          #   "- [ ] **Live marketplace"         — item 1: live /plugin marketplace add test
          #   "- [ ] **Hook CWD assumption"      — item 4: hook CWD live confirmation
          #   "- [ ] **`plugin.json` extra fields" — item 3: additionalProperties rejection risk
          # All three items block GA. Update this pattern whenever a new blocking item is added
          # or an existing item is resolved and removed from the checklist.
          OPEN_ITEMS=$(grep -cE '^\- \[ \] \*\*(Live marketplace|Hook CWD assumption|`plugin\.json` extra fields)' "$ADR" || true)
          if [ "$OPEN_ITEMS" -gt 0 ]; then
            echo "::error file=$ADR::Pre-GA live install tests not yet confirmed ($OPEN_ITEMS item(s) open in ADR 0003 checklist)."
            echo ""
            echo "  Failing items in $ADR:"
            grep -nE '^\- \[ \] \*\*(Live marketplace|Hook CWD assumption|`plugin\.json` extra fields)' "$ADR" || true
            echo ""
            echo "  To unblock: complete both live install tests, update the checklist"
            echo "  items from [ ] to [x], and push. This job will then pass automatically."
            echo ""
            echo "  See the Pre-GA checklist in $ADR for full details."
            exit 1
          fi
          echo "All Pre-GA live install checklist items are confirmed. pre-ga-gate passes."

  rails-guard:
    # The unbypassable commit-time backstop for the in-session rail hook: rejects
    # a PR whose diff touches a frozen rail, including via shell write forms the
    # hook does not recognize. No-ops when no rails are declared.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # full history so the diff base resolves

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Fetch base ref
        # env (not direct interpolation) + explicit refspec so origin/<base> is
        # created as a remote-tracking ref the gate can resolve.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Rail-freeze gate
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: node scripts/rails-guard-ci.mjs "origin/$BASE_REF"
