name: Router drift

# The single source of truth for the six ADLC phase routers is
# scripts/router/router-model.mjs; the committed router files are rendered from it by
# scripts/router/gen-routers.mjs. This workflow is the permanent, required gate that
# fails a PR whose committed router file drifted from the canonical source (someone
# hand-edited a generated file instead of the model, or forgot to regenerate).
#
# ============================================================
# ACTION REQUIRED — GITHUB REPOSITORY SETTINGS
# ============================================================
# Add "router-drift" as a required status check in
# Settings > Branches > Branch protection rules for main. A failing-but-not-required
# check does not block a merge (premortem finding #3: the drift check must be required,
# not advisory).
# ============================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  router-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so any merge-base tooling can resolve the branch point

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Router drift gate
        run: node scripts/router/gen-routers.mjs --check
