name: Router drift

# The single source of truth for the six ADLC phase routers is
# scripts/router/router-model.mjs; the committed router files are rendered from it by
# scripts/router/gen-routers.mjs. This workflow detects
# a PR whose committed router file drifted from the canonical source (someone
# hand-edited a generated file instead of the model, or forgot to regenerate).
#
# Whether this job is declared merge-blocking is recorded in
# docs/ci/required-gates.json; scripts/gate-liveness.mjs checks the live ruleset
# against that declaration. The same drift assertion also runs inside the
# required test job via scripts/test/router-drift.test.mjs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  router-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so any merge-base tooling can resolve the branch point

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Router drift gate
        run: node scripts/router/gen-routers.mjs --check
