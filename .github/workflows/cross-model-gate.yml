name: cross-model-gate

# #326 trust-root cross-model review gate — the TRUSTED-CONTEXT verifier.
#
# ────────────────────────────── SECURITY MODEL (read before editing) ──────────────────────────────
# The gate must verify a cross-model attestation with ADLC_MANIFEST_KEY. The key is the entire trust
# anchor: anyone who can read it can mint approvals forever. Therefore the key must NEVER be exposed
# to code or dependencies a pull-request author controls.
#
# This workflow uses `pull_request_target`, so it runs from the BASE branch definition with secrets
# available. It then:
#   1. checks out BASE (the trusted code we RUN) and installs BASE dependencies (base lockfile), and
#   2. materializes the PR tree into ./_pr as DATA via `git worktree` — which is NEVER executed.
# The gate runs the BASE `adlc-prosecute` binary (absolute path under $GITHUB_WORKSPACE) with its cwd
# set to the PR worktree, so Node resolves the CODE and DEPENDENCIES from the base checkout (import
# resolution is script-relative, not cwd-relative) while git/data operations see the PR tree. The PR's
# code and the PR's dependencies never run, so the key stays isolated.
#
# HARD RULES for anyone editing this file:
#   • NEVER `run:` a script, build, test, or `npm ci`/postinstall from ./_pr or from the PR head.
#   • NEVER run the PR's own packages/prosecute — always the base copy under $GITHUB_WORKSPACE.
#   • Keep `permissions:` at the minimum (contents: read). pull_request_target defaults to write.
#   • Do not add steps that echo secrets or pass ${{ secrets.* }} to anything touching ./_pr.
#
# ENFORCEMENT (do this to make the gate binding): mark the `gate` job below as a REQUIRED status
# check via branch protection / a ruleset on `main`. It fails closed (exit 2) on a missing or
# FORGED (unsigned / wrong-key / rewritten-sig) attestation, so as a required check it BLOCKS the
# merge on those. Until that protection is configured this repo has none, so the gate is only a
# trustworthy SIGNAL the maintainer merges on — an intentional fallback, not the end state. It
# runs as a separate workflow (not folded into the required test job) precisely so it can hold
# the key safely; that separation is compatible with making it required.
#
# TRUNCATION CLOSED (#355, #354 F1 follow-up — opt-in, THIS REPO ONLY, not a required ADLC
# capability): a required check alone does not close manifest TRUNCATION — it evaluates the
# PR-controlled tree, so an author who drops a signed `needs-attention` revocation leaves a valid
# chain ending in the earlier approve and the check would pass. This workflow closes it with a
# protected-ref mirror: BEFORE the gate step, it fetches the `adlc-attestations` orphan branch
# (ruleset-protected, see docs/github-rulesets/adlc-attestations-ruleset.json), mirrors every
# newly-observed signed cross-model entry into it, and pushes. The gate step then passes
# `--attestation-store` so `assertNoTruncation` (packages/prosecute/lib/attestation-store.mjs)
# can detect a signed entry the store has seen that is missing from the PR's own manifest. See
# docs/superpowers/specs/2026-07-28-cross-model-truncation-anchor-design.md for the full design,
# the honest residual limit (a revocation is protected only once a trusted run has observed it),
# and why this is opt-in rather than a default other ADLC adopters must apply.
#
# `contents: write` (was `read`) is needed ONLY for the mirror-push step below, and ONLY to the
# `adlc-attestations` ref — `main` stays ruleset-protected regardless of this workflow's token
# scope. The mirror step runs base code against PR data exactly like the gate step (same
# isolation the SECURITY MODEL above describes); the payload it pushes is signature-verified
# entries, never PR-controlled bytes taken on faith.

on:
  pull_request_target:
    branches: [main]

# Serializes runs PER PR so a revocation's mirror completes and is pushed before the next
# push's gate run for the SAME PR is evaluated — the one race that could otherwise let a
# truncation slip through. MUST be keyed on the PR number, NOT `github.ref`: under
# pull_request_target, `github.ref` resolves to the BASE ref (identical for every PR), which
# would silently collapse all PRs into one global queue instead of scoping per PR.
concurrency:
  group: cross-model-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BASE — the trusted code we RUN (default ref for pull_request_target)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # base history so the PR base SHA resolves for the diff
          # #355 round-3 cross-model review (codex): actions/checkout persists a
          # write-capable git credential by default. contents: write is now this
          # workflow's permission (needed ONLY for the later mirror/push step), so an
          # ambient persisted credential here would hand every base-lockfile
          # install/postinstall script (npm ci, below) that same write access — a
          # dependency compromise becomes a push primitive against a trust anchor.
          # Set up the write credential explicitly, later, ONLY for the step that push
          # actually needs (see "Configure a scoped git credential" below).
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install BASE dependencies (base lockfile — trusted; PR lockfile is never installed)
        run: npm ci

      - name: Materialize the PR tree as DATA (git worktree; never executed)
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$PR_HEAD"
          # A detached worktree of the PR head: its FILES are readable as data (manifest, ticket
          # store) and its git tree is diff-able, but nothing in it is ever run.
          git worktree add --detach ./_pr "$PR_HEAD"

      # ── #355 truncation anchor: steps below, base code only ────────────────────────────
      # ./_attestations is a SIBLING of ./_pr (never nested inside it) — a store nested inside
      # the PR worktree would itself become an untracked file there, perturbing the very
      # working-tree revision hash the gate binds to (proven while writing this workflow's
      # tests: revisionIgnorePaths only excludes .adlc/manifest.jsonl, not an arbitrary path).
      - name: Fetch or bootstrap the attestation store (adlc-attestations branch → ./_attestations)
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin adlc-attestations >/dev/null; then
            git fetch origin adlc-attestations:refs/remotes/origin/adlc-attestations
            git worktree add ./_attestations origin/adlc-attestations
            git -C ./_attestations checkout -B adlc-attestations origin/adlc-attestations
          else
            # Bootstrap: the branch does not exist yet — first trusted run ever.
            git worktree add --detach ./_attestations
            git -C ./_attestations checkout --orphan adlc-attestations
            git -C ./_attestations rm -rf . --quiet 2>/dev/null || true
          fi

      # Write credential begins HERE, not at checkout (see the persist-credentials note above)
      # — this is the same header actions/checkout would install, just deferred until the
      # narrow step that actually needs write access, well after npm ci already ran with none.
      - name: Configure a scoped git credential for the attestation-store push
        run: |
          git config --global "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(echo -n "x-access-token:${{ secrets.GITHUB_TOKEN }}" | base64 -w 0)"

      # Mirror + commit + push as ONE retryable cycle — cross-model review round 1 (codex)
      # caught two real bugs the earlier two-step version had:
      #   1. mirrorObservedAttestations returns early WITHOUT creating attestations.jsonl when
      #      there is nothing new to append (the correct behavior for that library — see
      #      lib/attestation-store.mjs). A bootstrap run before any cross-model attestation has
      #      ever been recorded therefore has NO file to `git add`, which must not be an error.
      #   2. `concurrency.group` only serializes runs for the SAME PR; two different PRs both
      #      pushing to the shared adlc-attestations branch can race — a plain push has no
      #      retry, so an unrelated PR's push can be spuriously rejected (non-fast-forward).
      # On a push rejection this RESETS to the fresh remote tip and RE-RUNS mirror-attestations
      # (rather than rebasing the stale local commit), so the retry is a clean re-derivation
      # against current state, not a git-level text merge of two independent JSONL appends.
      - name: Mirror newly-observed cross-model attestations and push (retries on a concurrent push from another PR)
        env:
          ADLC_MANIFEST_KEY: ${{ secrets.ADLC_MANIFEST_KEY }}
        run: |
          set -euo pipefail
          git -C ./_attestations config user.name "github-actions[bot]"
          git -C ./_attestations config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            (cd ./_pr && node "$GITHUB_WORKSPACE/packages/prosecute/bin/adlc-prosecute.mjs" mirror-attestations \
              --attestation-store "$GITHUB_WORKSPACE/_attestations/attestations.jsonl" --dir .adlc)
            if [ -f ./_attestations/attestations.jsonl ]; then
              git -C ./_attestations add attestations.jsonl
            fi
            if git -C ./_attestations diff --cached --quiet; then
              echo "no new attestations to mirror this run"
              exit 0
            fi
            git -C ./_attestations commit -q -m "mirror cross-model attestations for PR #${{ github.event.pull_request.number }}"
            if git -C ./_attestations push origin HEAD:adlc-attestations; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) — another PR's mirror landed first; refetching and retrying"
            git -C ./_attestations fetch origin adlc-attestations
            git -C ./_attestations reset --hard origin/adlc-attestations
          done
          echo "could not push the attestation store after 5 attempts — failing closed, never gating on an unlanded update" >&2
          exit 1

      - name: Verify cross-model attestation — BASE code, PR data, key isolated from PR code
        working-directory: ./_pr
        env:
          # The key reaches ONLY this step, which runs the base binary. The PR tree in cwd is read
          # as data; its code/deps never execute, so a contributor cannot read or exfiltrate the key.
          ADLC_MANIFEST_KEY: ${{ secrets.ADLC_MANIFEST_KEY }}
          ADLC_AUTHOR_PROVIDER: ${{ vars.ADLC_AUTHOR_PROVIDER || 'anthropic' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # $GITHUB_WORKSPACE = the BASE checkout. Running the base binary with cwd=./_pr makes
          # tier-check classify the PR's diff (base..PR tree), derive the PR's revision, and read the
          # PR's .adlc manifest — all as data — while the executed code + node_modules are the base's.
          # --attestation-store points OUTSIDE ./_pr (see the sibling-worktree note above).
          node "$GITHUB_WORKSPACE/packages/prosecute/bin/adlc-prosecute.mjs" tier-check \
            --base "$BASE_SHA" --author-provider "$ADLC_AUTHOR_PROVIDER" --dir .adlc \
            --attestation-store "$GITHUB_WORKSPACE/_attestations/attestations.jsonl"
