# ADLC × herdr plugin manifest.
#
# Entrypoints land with their tickets: [[startup]] watcher (t-herdr-2, here),
# [[actions]] (t-herdr-3), [[panes]] board (t-herdr-4). No [[build]] commands
# ever — the plugin ships runnable, zero-dep (plan §6.6).
id = "adlc"
name = "ADLC"
version = "0.2.0"
min_herdr_version = "0.7.4"
description = "Agentic Development Lifecycle: per-pane phase/ticket/gate status, backlog board, gate actions, and fleet run observability."
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "bin/watcher.mjs"]

[[actions]]
id = "ticket-show"
title = "ADLC: show active ticket"
contexts = ["pane"]
command = ["node", "bin/action.mjs"]

[[actions]]
id = "gate"
title = "ADLC: verify gate evidence for this pane's repo"
contexts = ["pane"]
command = ["node", "bin/action.mjs"]

[[actions]]
id = "prosecute"
title = "ADLC: prosecute this pane's worktree (P5 review)"
contexts = ["pane"]
command = ["node", "bin/action.mjs"]
