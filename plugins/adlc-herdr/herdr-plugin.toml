# ADLC × herdr plugin manifest.
#
# Entrypoints land with their tickets: [[startup]] watcher (t-herdr-2),
# [[actions]] (t-herdr-3), [[panes]] board (t-herdr-4), [[events]] glue
# (t-herdr-5). No [[build]] commands ever — the plugin ships runnable,
# zero-dep (plan §6.6).
id = "adlc"
name = "ADLC"
version = "0.2.0"
min_herdr_version = "0.7.4"
description = "Agentic Development Lifecycle: per-pane phase/ticket/gate status, backlog board, gate actions, and fleet run observability."
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "bin/watcher.mjs"]

# Event glue (t-herdr-5). Names are DOTTED (probed live 2026-07-24); the
# payload's own `event`/`type` fields use underscores.
[[events]]
on = "worktree.created"
command = ["node", "bin/on-event.mjs"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "bin/on-event.mjs"]

[[events]]
on = "pane.exited"
command = ["node", "bin/on-event.mjs"]

[[panes]]
id = "board"
title = "ADLC board"
placement = "overlay"
command = ["node", "bin/board.mjs"]

[[actions]]
id = "ticket-show"
title = "ADLC: show active ticket"
contexts = ["pane"]
command = ["node", "bin/action.mjs"]

[[actions]]
id = "gate"
title = "ADLC: verify gate evidence for this pane's repo"
contexts = ["pane"]
command = ["node", "bin/action.mjs"]

[[actions]]
id = "prosecute"
title = "ADLC: prosecute this pane's worktree (P5 review)"
contexts = ["pane"]
command = ["node", "bin/action.mjs"]

[[actions]]
id = "ticket-complete"
title = "ADLC: preview completing this pane's active ticket"
contexts = ["pane"]
command = ["node", "bin/action.mjs"]

[[actions]]
id = "adlc-init"
title = "ADLC: initialize .adlc in this pane's repo"
contexts = ["pane"]
command = ["node", "bin/action.mjs"]
