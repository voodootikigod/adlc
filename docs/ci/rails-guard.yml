# ADLC rail-freeze CI backstop — copy into your repo as
# .github/workflows/adlc-rails-guard.yml
# OpenCode /adlc-init template source: docs/ci/rails-guard.yml
#
# This is the base-branch commit-time gate backing the in-session PreToolUse rail
# hook. The hook blocks Edit/Write/MultiEdit and common Bash writes to frozen
# rails, but a shell write form it does not recognize (node -e, python, cp,
# perl -i, …) still lands in the PR diff — this job rejects that PR when the rail
# was already frozen on the base branch.
#
# SINGLE SOURCE (#140). The gate logic is NOT inlined here. It ships as
# `adlc rails-guard-ci` in the pinned @adlc/cli installed below, and it is the
# same code path the ADLC repo runs on itself. This file used to embed a ~500-line
# `node -e` copy of that gate, hand-mirrored on every change and pinned by a sha256
# fixture — a fixture that could prove the copies were UNCHANGED but never that they
# AGREED. They drifted: #314 fixed a manifest fail-open in the script that this
# template never received. There is one implementation now.
#
# WHAT THIS CHANGED FOR YOU, IF YOU DEPLOYED AN EARLIER TEMPLATE:
#   * The gate is read from the pinned package rather than from this file. Auditing
#     it means auditing that version — which was already true for the verdict, since
#     the old inline script also delegated to `adlc rails-guard`. Bump the pin
#     deliberately, after reviewing the release.
#   * A legacy→directory ticket-store MIGRATION is now ALLOWED when it carries valid,
#     hash-chained manifest evidence, instead of being denied outright. The old denial
#     was not a policy choice: this file could not verify migration evidence, so it
#     failed closed and routed migrations to the protected base. The shared gate can
#     verify it, so it does.
#   * `scripts/test/rails-guard-workflow-hashes.json` is no longer a trust root. It
#     existed only to pin the inline copy that no longer exists.
#
# It reads every rail glob declared in the trusted base ticket store — either the
# legacy .adlc/tickets.json file or the canonical sharded directory store
# (.adlc/tickets/ with a .store.json manifest) — and runs the diff-based rail gate
# against the PR base. Once .adlc/config.json exists on the base branch, it also
# protects immutable ADLC trust roots even if no ticket rails exist yet. Configure it
# as a required check only after acknowledging the SECURITY LIMITATION below.
#
# RAILS COMPLETION LIFECYCLE (T36): a ticket's rails freeze sibling paths only
# while the ticket is IN FLIGHT. When a ticket in the trusted BASE ticket store is
# marked `completed: true`, its rails AUTO-EXPIRE — they stop contributing to the
# frozen set. The trust anchor is the ticket contract, NOT the manifest (this gate
# holds no signing key, so a manifest tag would be forgeable): setting `completed`
# on an existing ticket is a change to that ticket's contract, which this gate
# already DENIES for ordinary PRs — only the protected-base admin ceremony can mark
# completion, and the union reads it from the BASE ref, never the PR HEAD. It fails
# closed: only a strict boolean `true` lifts, and a path frozen by ANY still-in-flight
# ticket stays frozen.
# NOTE: `completed: true` expires ALL of that ticket's rails. If a path must stay
# protected AFTER the ticket completes, re-declare it on a still-in-flight ticket
# (or a permanent-guardian ticket) before completing — do not complete a ticket
# that is the sole freezer of a still-sensitive path. A completed ticket's
# CONTRACT stays immutable (only its rails expire from enforcement).
#
# SECURITY LIMITATION: this gate does not protect rails introduced for the first
# time in the same PR. New rails are enforced only after they land on the base
# branch. Do not treat this workflow as complete rail-freeze enforcement for newly
# frozen paths. /adlc-init must require --acknowledge-new-rail-bypass (headless) or
# an interactive TUI confirmation before scaffolding this template as a required
# check until a future new-rail-aware union gate ships.
#
# SELF-PROTECTION REQUIREMENT: before configuring this as a required check,
# protect the deployed .github/workflows/adlc-rails-guard.yml with CODEOWNERS or
# a branch ruleset requiring trusted-owner approval. GitHub pull_request events
# from same-repository branches run the PR branch's workflow file, so this gate
# cannot defend itself if a PR removes it. The effective CODEOWNERS file must not
# leave the deployed workflow path ownerless through a later no-owner or negation
# entry, even when a broader earlier pattern names trusted owners. The bootstrap
# step mechanically verifies that CODEOWNERS covers the workflow path; it cannot
# prove the owners are trusted. After configuring branch protection/rulesets, set
# `trustedCodeownersAttested: true` in base .adlc/config.json through a
# trusted-owner reviewed commit before enabling this workflow as required.
#
# Signed evidence mode requires a repository-managed ADLC_RUNNER_PATH secret
# pointing to an audited adlc-runner binary by absolute path. This template
# intentionally does not install the unpublished @adlc/runner package from npm.
# Signed mode also requires `runnerBinarySha256` in .adlc/config.json.
# Run signed mode only on the dedicated `adlc-signed` self-hosted runner pool,
# with ADLC_SIGNED_RUNNER_POOL=1 set as an Actions variable for that protected
# runner environment. Shared self-hosted runners must not be able to write to
# ADLC_RUNNER_PATH or its temporary execution copy.
#
# Signed-mode PR checks execute the audited runner probe during pull_request.
# Runner-host filesystem integrity is a prerequisite; if that execution surface
# is unacceptable, split the signed runner probe into a protected-base push job.
#
# Post-bootstrap signer changes are intentionally blocked in PRs because
# .adlc/config.json is a rail trust root. Grant them through a protected-base
# admin ceremony countersigned by an existing approver.
#
# Existing base ticket entries are protected by id and stable semantic content.
# Ordinary PRs may add new ticket entries, but they cannot edit or remove existing
# ticket contracts. Existing `.adlc/manifest.jsonl` evidence must remain
# append-only; when no base manifest exists, ordinary PRs may create only an absent
# or empty manifest. First-time bootstrap PRs must not introduce pre-populated
# manifest evidence.

name: ADLC Rails Guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  rails-guard:
    # Unsigned-fallback bootstrap can run on GitHub-hosted runners. Signed mode
    # fast-fails below unless this job is moved to [self-hosted, adlc-signed]
    # with ADLC_SIGNED_RUNNER_POOL=1 exposed through the step env below.
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (not floating tags). Refresh deliberately.
      # Both run on node24, which requires Actions Runner v2.327.1 or newer. GitHub-
      # hosted runners self-update; a SELF-HOSTED runner does not. If you move this job
      # to a self-hosted pool (see the signed-evidence note above), update the runner
      # first or these steps fail before the gate ever runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the diff base resolves

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install the ADLC toolkit
        # Pinned to an exact, audited version (not mutable `@latest`) on a runner
        # with repo access. This pin now carries the GATE ITSELF, not only the
        # verdict renderer — bump it deliberately after reviewing the release.
        # `--ignore-scripts` blocks install-time scripts; the CLIs are zero-dep.
        run: npm install -g --ignore-scripts @adlc/cli@1.6.0

      - name: Fetch base ref
        # Pass the ref via env (not direct ${{ }} shell interpolation), and use an
        # explicit refspec so the origin/<base> REMOTE-TRACKING ref is created —
        # actions/checkout's narrow fetch config does not create it otherwise, and
        # the gate resolves `origin/<base>`.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Verify ADLC bootstrap acknowledgement
        # Bootstrap ordering: enable this workflow as a required check only after the
        # initial .adlc/config.json acknowledgement has landed on the base branch.
        # The only allowed first-PR escape is a base branch with no .adlc tree at all.
        run: adlc rails-guard-ci bootstrap
        env:
          BASE_REF: ${{ github.base_ref }}
          ADLC_RUNNER_PATH: ${{ secrets.ADLC_RUNNER_PATH }}
          ADLC_SIGNED_RUNNER_POOL: ${{ vars.ADLC_SIGNED_RUNNER_POOL }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}

      - name: Rail-freeze gate
        # Exit 0 = nothing frozen was touched · 2 = a rail or trust root was modified
        # · 1 = operational error or unverifiable input (fails closed, never open).
        run: adlc rails-guard-ci
        env:
          BASE_REF: ${{ github.base_ref }}
